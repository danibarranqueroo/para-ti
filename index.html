<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100C12">
<meta name="color-scheme" content="dark">
<!-- Que ningún buscador la indexe: es solo para ella -->
<meta name="robots" content="noindex, nofollow">
<title>Para ti</title>

<!-- Cómo se ve el enlace al enviarlo por WhatsApp (sin destripar la sorpresa) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Para ti">
<meta property="og:description" content="Ábrelo cuando tengas un ratito para ti ♥">
<meta property="og:image" content="img/og.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Las fuentes se cargan sin bloquear el pintado: si ella tiene mala
     cobertura, el texto aparece igual y las fuentes entran después. -->
<link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Caveat:wght@400;600&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Caveat:wght@400;600&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Caveat:wght@400;600&display=swap"></noscript>
<link rel="stylesheet" href="css/styles.css?v=1bc38754">
</head>
<body class="is-locked">

<!-- Pantalla de entrada: hasta que no toque el corazón, no se ve nada.
     También es el gesto que permite arrancar la música en iPhone. -->
<div class="gate" id="gate">
  <p class="gate__name" id="gateName"></p>
  <p class="gate__msg" id="gateMsg"></p>
  <button class="gate__heart" id="gateHeart" type="button" aria-label="Entrar">
    <svg viewBox="0 0 32 29" aria-hidden="true" focusable="false">
      <path d="M16 29S0 19.3 0 9.2A9.2 9.2 0 0 1 16 3a9.2 9.2 0 0 1 16 6.2C32 19.3 16 29 16 29z"/>
    </svg>
  </button>
  <div class="gate__bar" id="gateBar" aria-hidden="true"><span></span></div>
  <p class="gate__hint" id="gateHint"></p>
</div>

<div class="progress" id="progress" aria-hidden="true"><span></span></div>

<main id="historia" aria-live="off"></main>

<button class="music-toggle" id="musicToggle" type="button" hidden
        aria-label="Reproducir música" aria-pressed="false">
  <span class="music-icon" aria-hidden="true">♪</span>
</button>

<audio id="audio" loop preload="none" playsinline></audio>

<noscript>
  <style>.gate { display: none !important; } body.is-locked { overflow: auto; }
         body.is-locked #historia { visibility: visible; }</style>
  <div class="noscript">
    <p>Necesitas activar JavaScript para ver esta página.</p>
  </div>
</noscript>

<script src="js/content.js?v=1bc38754"></script>
<script src="js/main.js?v=1bc38754"></script>
</body>
</html>
