<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100C12">
<meta name="color-scheme" content="dark">
<!-- Que ningún buscador la indexe: es solo para ella -->
<meta name="robots" content="noindex, nofollow">
<title>Para ti</title>

<!-- Cómo se ve el enlace al enviarlo por WhatsApp (sin destripar la sorpresa) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Para ti">
<meta property="og:description" content="Ábrelo cuando tengas un ratito para ti ♥">
<meta property="og:image" content="img/og.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Las fuentes se cargan sin bloquear el pintado: si ella tiene mala
     cobertura, el texto aparece igual y las fuentes entran después. -->
<link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Caveat:wght@400;600&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Caveat:wght@400;600&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Caveat:wght@400;600&display=swap"></noscript>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"><span></span></div>

<main id="historia" aria-live="off"></main>

<button class="music-toggle" id="musicToggle" type="button" hidden
        aria-label="Reproducir música" aria-pressed="false">
  <span class="music-icon" aria-hidden="true">♪</span>
</button>

<audio id="audio" loop preload="none" playsinline></audio>

<noscript>
  <div class="noscript">
    <p>Necesitas activar JavaScript para ver esta página.</p>
  </div>
</noscript>

<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
