<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tarjeta para imprimir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Caveat:wght@600&display=swap">
<style>
  :root { --tinta: #4A3B32; --acento: #C0663A; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px;
    background: #E8E0D4;
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--tinta);
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .aviso {
    max-width: 420px; text-align: center; font-size: 15px; line-height: 1.6;
    color: #6B584C; font-family: -apple-system, system-ui, sans-serif;
  }
  .aviso b { color: var(--tinta); }

  .tarjeta {
    width: 105mm; height: 148mm;            /* A6: media cuartilla */
    background: #FBF5E9;
    border: 1px solid #DFD2BC;
    border-radius: 3mm;
    padding: 12mm 10mm;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6mm;
    text-align: center;
    box-shadow: 0 18px 40px -24px rgba(74,59,50,.6);
  }
  .para { font-style: italic; font-size: 26pt; color: var(--acento); margin: 0; line-height: 1.1; }
  .fecha {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 8pt; letter-spacing: .28em; text-transform: uppercase;
    color: #8A7566; margin: 0;
  }
  .qr { width: 52mm; height: 52mm; display: block; }
  .instruccion { font-size: 13pt; font-style: italic; margin: 0; color: #6B584C; }
  .firma { font-family: "Caveat", cursive; font-size: 19pt; color: var(--acento); margin: 0; }
  .corazon { width: 7mm; fill: var(--acento); }

  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; padding: 0; display: block; }
    .aviso { display: none; }
    .tarjeta {
      box-shadow: none;
      border: 1px dashed #C9BCA6;
      margin: 0 auto;
      /* Sin esto el navegador NO imprime el fondo crema ni el corazón:
         saldría la tarjeta en blanco sobre blanco. */
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .corazon { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<p class="aviso">
  Esto es la tarjeta para <b>imprimir y darle en mano</b>.<br>
  Pulsa <b>Cmd + P</b> y sale sola en A4, centrada, para recortar.<br>
  Al escanear el QR se abre la web.
</p>

<div class="tarjeta">
  <p class="fecha">26 de septiembre</p>
  <p class="para">Para Andrea</p>

  <svg class="corazon" viewBox="0 0 32 29" aria-hidden="true">
    <path d="M16 29S0 19.3 0 9.2A9.2 9.2 0 0 1 16 3a9.2 9.2 0 0 1 16 6.2C32 19.3 16 29 16 29z"/>
  </svg>

  <img class="qr" src="img/qr.png" alt="Código QR que lleva a la web">

  <p class="instruccion">Escanéame cuando<br>tengas un ratito para ti</p>
  <p class="firma">Dani</p>
</div>

</body>
</html>
